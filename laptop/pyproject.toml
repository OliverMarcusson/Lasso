[project]
name = "lasso"
version = "0.1.0"
description = "Ask an Android phone over BLE to start a private Wi-Fi hotspot, join it, heartbeat, release."
requires-python = ">=3.12"
dependencies = ["bleak>=0.22", "dbus-fast>=2.21"]

[project.scripts]
lasso = "lasso.cli:main"
lassod = "lasso.daemon:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lasso"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
